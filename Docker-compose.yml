version: "3"
services:
  selenium-hub:
    image: selenium/hub
    container_name: selenium-hub
    ports:
      - "4444:4444"
  chrome:
    image: selenium/node-chrome-debug
    depends_on:
      - selenium-hub
    environment:
      - HUB_HOST=selenium-hub
      - BROWSER=chrome
      - HUB_PORT=4444
    ports:
      - "32774:5900"
  firefox:
    image: selenium/node-firefox-debug
    depends_on:
      - selenium-hub
    environment:
      - HUB_HOST=selenium-hub
      - BROWSER=firefox
      - HUB_PORT=4444
    ports:
      - "32777:5900"      
      
      